aid: kintra-fibers
name: Kintra Fibers
description: 'Kintra Fibers is a Brooklyn, New York materials-science company that has
  developed a proprietary bio-based and biodegradable synthetic yarn as an alternative
  to conventional petroleum polyester. Its polymer is a novel form of polybutylene
  succinate (PBS) made from renewable corn- and wheat-derived sugar feedstocks, melt-spun
  on the same commercial equipment already used for polyester so that mills, spinners
  and extruders can adopt it without re-tooling. The company sells four physical products
  into the apparel supply chain — resin for extruders, staple fiber for spinners, 75D/72F
  multifilament yarn in FDY, ATY and DTY forms for mills, and finished performance fabric
  for brands. Co-founded by Billy McCall and Alissa Baier-Lentz, Kintra runs an in-house
  resin and fiber science lab in Brooklyn, launched a Fashion for Good consortium with
  Inditex, Bestseller and Reformation, and closed a funding round led by H&M Group. Kintra
  is a manufacturer of physical materials, not a software company: it operates no developer
  program, publishes no public API, SDK, webhook or machine-readable API contract, and its
  only web property is a Webflow marketing and contact site.'
